<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления ботами</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Сайдбар */
        aside {
            width: 280px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bots-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .bot-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .bot-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .bot-item.active {
            background-color: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
        }

        .bot-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bot-name {
            font-weight: 500;
        }

        .bot-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online { background-color: var(--success); }
        .status-offline { background-color: var(--text-muted); }

        .add-bot-btn {
            margin: 15px;
            padding: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .add-bot-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Основной контент */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-header {
            padding: 20px 30px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bot-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            color: white;
            transition: opacity 0.2s, background-color 0.2s;
        }

        button:hover { opacity: 0.9; }

        .btn-start { background-color: var(--success); }
        .btn-stop { background-color: var(--danger); }
        .btn-restart { background-color: var(--warning); }
        .btn-secondary { background-color: var(--border-color); }

        /* Логи */
        .logs-container {
            flex: 1;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .logs-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logs-output {
            flex: 1;
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
        }

        .auto-scroll-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .no-bot-selected {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .modal input {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 1rem;
            outline: none;
        }

        .modal input:focus {
            border-color: var(--primary);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Сайдбар с ботами -->
    <aside>
        <div class="sidebar-header">
            <span>Мои боты</span>
        </div>
        <div class="bots-list" id="botsList">
            <!-- Список ботов рендерится динамически -->
        </div>
        <button class="add-bot-btn" onclick="openAddBotModal()">+ Добавить бота</button>
    </aside>

    <!-- Основная рабочая зона -->
    <main id="mainArea">
        <div class="no-bot-selected" id="noBotSelected">
            Выберите бота из списка слева
        </div>

        <div id="botWorkspace" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
            <div class="main-header">
                <div class="bot-title" id="currentBotTitle">Имя бота</div>
                <div class="controls">
                    <button class="btn-start" onclick="controlBot('start')">Запустить</button>
                    <button class="btn-restart" onclick="controlBot('restart')">Перезапустить</button>
                    <button class="btn-stop" onclick="controlBot('stop')">Остановить</button>
                </div>
            </div>

            <div class="logs-container">
                <div class="logs-header">
                    <span>Логи работы</span>
                    <div class="logs-actions">
                        <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="clearLogs()">Очистить логи</button>
                        <label class="auto-scroll-label">
                            <input type="checkbox" id="autoScroll" checked> Автопрокрутка
                        </label>
                    </div>
                </div>
                <div class="logs-output" id="logsOutput"></div>
            </div>
        </div>
    </main>

    <!-- Модальное окно добавления бота -->
    <div class="modal-overlay" id="addBotModal">
        <div class="modal">
            <h3>Добавить нового бота</h3>
            <input type="text" id="botNameInput" placeholder="Название бота или путь к скрипту...">
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeAddBotModal()">Отмена</button>
                <button class="btn-start" onclick="submitAddBot()">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        let bots = [];
        let currentBotId = null;
        let logsCache = {};

        // Подключение по WebSocket (автоопределение wss/ws)
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(`${protocol}${location.host}`);

        ws.onopen = () => {
            console.log('WebSocket соединение установлено');
            fetchBots();
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'log') {
                    if (!logsCache[data.botId]) logsCache[data.botId] = '';
                    logsCache[data.botId] += data.message + '\n';
                    
                    if (currentBotId === data.botId) {
                        renderLogs();
                    }
                } else if (data.type === 'status_update') {
                    updateBotStatusInList(data.botId, data.status);
                }
            } catch (e) {
                console.error('Ошибка обработки сообщения WS:', e);
            }
        };

        ws.onclose = () => {
            console.warn('WebSocket соединение разорвано');
        };

        async function fetchBots() {
            try {
                const response = await fetch('/api/processes');
                if (!response.ok) throw new Error('Ошибка загрузки процессов');
                bots = await response.json();
                renderBotsList();
                
                // Если боты есть, а текущий не выбран — автоматически выбираем первого
                if (bots.length > 0 && !currentBotId) {
                    selectBot(bots[0].id);
                }
            } catch (e) {
                console.error('Не удалось загрузить список ботов', e);
            }
        }

        function renderBotsList() {
            const listEl = document.getElementById('botsList');
            listEl.innerHTML = '';

            if (bots.length === 0) {
                listEl.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem; padding: 20px;">Нет добавленных ботов</div>';
                return;
            }

            bots.forEach(bot => {
                const item = document.createElement('div');
                item.className = `bot-item ${bot.id === currentBotId ? 'active' : ''}`;
                item.onclick = () => selectBot(bot.id);

                const isOnline = bot.status === 'online' || bot.status === 'running';

                item.innerHTML = `
                    <div class="bot-info">
                        <span class="bot-name">${escapeHtml(bot.name || bot.id)}</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">${bot.status || 'offline'}</span>
                    </div>
                    <span class="bot-status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
                `;
                listEl.appendChild(item);
            });
        }

        function selectBot(id) {
            currentBotId = id;
            const bot = bots.find(b => b.id === id);

            document.getElementById('noBotSelected').style.display = 'none';
            document.getElementById('botWorkspace').style.display = 'flex';
            
            if (bot) {
                document.getElementById('currentBotTitle').innerText = bot.name || bot.id;
            }

            renderBotsList();
            renderLogs();
        }

        function renderLogs() {
            const output = document.getElementById('logsOutput');
            output.innerText = logsCache[currentBotId] || 'Логи пока отсутствуют...\n';

            const autoScroll = document.getElementById('autoScroll').checked;
            if (autoScroll) {
                output.scrollTop = output.scrollHeight;
            }
        }

        function clearLogs() {
            if (!currentBotId) return;
            logsCache[currentBotId] = '';
            renderLogs();
        }

        function updateBotStatusInList(botId, status) {
            const bot = bots.find(b => b.id === botId);
            if (bot) {
                bot.status = status;
                renderBotsList();
            }
        }

        async function controlBot(action) {
            if (!currentBotId) return;
            try {
                const response = await fetch(`/api/bots/${currentBotId}/${action}`, {
                    method: 'POST'
                });
                const result = await response.json();
                if (!response.ok) {
                    alert(result.error || 'Ошибка при выполнении действия');
                }
            } catch (e) {
                console.error('Ошибка запроса управления:', e);
                alert('Не удалось отправить запрос на сервер');
            }
        }

        function openAddBotModal() {
            document.getElementById('botNameInput').value = '';
            document.getElementById('addBotModal').style.display = 'flex';
            document.getElementById('botNameInput').focus();
        }

        function closeAddBotModal() {
            document.getElementById('addBotModal').style.display = 'none';
        }

        async function submitAddBot() {
            const botName = document.getElementById('botNameInput').value.trim();
            if (!botName) return;

            try {
                const response = await fetch('/api/bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: botName })
                });

                if (response.ok) {
                    closeAddBotModal();
                    fetchBots();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Не удалось добавить бота');
                }
            } catch (err) {
                console.error('Ошибка добавления бота:', err);
                alert('Ошибка соединения с сервером');
            }
        }

        // Закрытие модального окна по нажатию Enter или Escape
        document.getElementById('botNameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitAddBot();
            if (e.key === 'Escape') closeAddBotModal();
        });

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
