<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapman Bot Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Consolas', 'Monospace', monospace; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
    .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 1.25rem; font-weight: 600; color: #58a6ff; }
    .status-badge { padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .status-badge.running { background: #238636; color: #fff; }
    .status-badge.stopped { background: #da3633; color: #fff; }
    .container { display: grid; grid-template-columns: 1fr 420px; height: calc(100vh - 60px); }
    .main { padding: 1.5rem; overflow: hidden; display: flex; flex-direction: column; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 1rem; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
    .panel-header { background: #21262d; border-bottom: 1px solid #30363d; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; }
    .panel-header h2 { font-size: 0.875rem; font-weight: 600; }
    .btn { padding: 0.375rem 0.75rem; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-family: inherit; transition: all 0.15s; }
    .btn:hover { background: #30363d; border-color: #484f58; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #238636; border-color: #238636; }
    .btn-primary:hover { background: #2ea043; border-color: #2ea043; }
    .btn-danger { background: #da3633; border-color: #da3633; }
    .btn-danger:hover { background: #f85149; border-color: #f85149; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .console { flex: 1; overflow-y: auto; padding: 1rem; font-size: 0.75rem; line-height: 1.6; }
    .log-entry { padding: 0.125rem 0; border-bottom: 1px solid #1f2428; white-space: pre-wrap; word-break: break-word; }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: #8b949e; margin-right: 0.5rem; }
    .log-type-system { color: #58a6ff; }
    .log-type-stdout { color: #7ee787; }
    .log-type-stderr { color: #f85149; }
    .log-type-error { color: #f85149; font-weight: bold; }
    .log-type-input { color: #d2a8ff; }
    .sidebar { background: #161b22; border-left: 1px solid #30363d; padding: 1.5rem; overflow-y: auto; }
    .widget { background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .widget h3 { font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; color: #58a6ff; }
    .info-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #30363d; font-size: 0.8rem; }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #8b949e; }
    .info-value { font-family: 'Consolas', monospace; }
    .command-input { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .command-input input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.5rem; color: #c9d1d9; font-family: inherit; font-size: 0.8rem; }
    .command-input input:focus { outline: none; border-color: #58a6ff; }
    .tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab { padding: 0.5rem 1rem; background: transparent; border: 1px solid #30363d; border-radius: 6px 6px 0 0; color: #8b949e; cursor: pointer; font-size: 0.75rem; font-family: inherit; }
    .tab.active { background: #21262d; color: #c9d1d9; border-bottom-color: #21262d; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .process-list { max-height: 400px; overflow-y: auto; }
    .process-item { padding: 0.5rem; border-bottom: 1px solid #1f2428; font-size: 0.75rem; display: grid; grid-template-columns: 60px 1fr 60px 70px 60px; gap: 0.5rem; align-items: center; }
    .process-item.header { background: #21262d; font-weight: 600; color: #8b949e; position: sticky; top: 0; z-index: 1; }
    .process-item:last-child { border-bottom: none; }
    .process-name { color: #58a6ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .process-pid { color: #8b949e; text-align: right; }
    .process-cpu { color: #d2a8ff; text-align: right; }
    .process-mem { color: #7ee787; text-align: right; }
    .process-actions { display: flex; gap: 0.25rem; justify-content: flex-end; }
    .btn-sm { padding: 0.125rem 0.375rem; font-size: 0.65rem; }
    .config-form { display: flex; flex-direction: column; gap: 0.75rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
    .form-group input, .form-group select { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.5rem; color: #c9d1d9; font-family: inherit; font-size: 0.8rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #58a6ff; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #238636; }
    .connection-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: #8b949e; }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #da3633; }
    .connection-dot.connected { background: #238636; }
    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; }
      .sidebar { border-left: none; border-top: 1px solid #30363d; }
      .process-item { grid-template-columns: 50px 1fr 50px 60px 50px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Chapman Bot Panel</h1>
    <div class="connection-status">
      <span class="connection-dot" id="wsStatus"></span>
      <span id="wsText">Disconnected</span>
    </div>
  </header>
  <div class="container">
    <main class="main">
      <div class="panel">
        <div class="panel-header">
          <h2>Console</h2>
          <div class="btn-group">
            <button class="btn btn-primary" id="btnStart" onclick="sendCmd('start')">Start</button>
            <button class="btn btn-danger" id="btnStop" onclick="sendCmd('stop')">Stop</button>
            <button class="btn" id="btnRestart" onclick="sendCmd('restart')">Restart</button>
            <button class="btn" id="btnReconnect" onclick="sendCmd('reconnect')">Reconnect</button>
            <button class="btn" id="btnClear" onclick="clearConsole()">Clear</button>
          </div>
        </div>
        <div class="console" id="console"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Send Command</h2>
        </div>
        <div class="command-input">
          <input type="text" id="cmdInput" placeholder="Enter command (e.g. /say hello)" onkeypress="if(event.key==='Enter') sendCommand()">
          <button class="btn btn-primary" onclick="sendCommand()">Send</button>
        </div>
      </div>
    </main>
    <aside class="sidebar">
      <div class="widget">
        <h3>Bot Status</h3>
        <div class="info-row"><span class="info-label">Status</span><span class="info-value"><span class="status-badge stopped" id="botStatus">Stopped</span></span></div>
        <div class="info-row"><span class="info-label">PID</span><span class="info-value" id="botPid">-</span></div>
        <div class="info-row"><span class="info-label">Username</span><span class="info-value" id="botUsername">-</span></div>
        <div class="info-row"><span class="info-label">Server</span><span class="info-value" id="botServer">-</span></div>
        <div class="info-row"><span class="info-label">Version</span><span class="info-value" id="botVersion">-</span></div>
        <div class="info-row"><span class="info-label">Memory</span><span class="info-value" id="botMem">-</span></div>
        <div class="info-row"><span class="info-label">CPU</span><span class="info-value" id="botCpu">-</span></div>
      </div>
      <div class="widget">
        <h3>Configuration</h3>
        <form class="config-form" id="configForm" onsubmit="saveConfig(event)">
          <div class="form-row">
            <div class="form-group"><label>Host</label><input type="text" id="cfgHost" required></div>
            <div class="form-group"><label>Port</label><input type="number" id="cfgPort" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Version</label><input type="text" id="cfgVersion" required></div>
            <div class="form-group"><label>Username</label><input type="text" id="cfgUsername" required></div>
          </div>
          <div class="form-group"><label>Password</label><input type="password" id="cfgPassword" placeholder="Leave empty to keep current"></div>
          <div class="form-row">
            <div class="form-group"><label>Auth</label><select id="cfgAuth"><option value="offline">Offline</option><option value="microsoft">Microsoft</option><option value="mojang">Mojang</option></select></div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="cfgAutoReconnect"><label style="font-size:0.75rem;text-transform:none;">Auto Reconnect</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="cfgAntiAfk"><label style="font-size:0.75rem;text-transform:none;">Anti-AFK</label>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Save Config</button>
        </form>
      </div>
      <div class="widget">
        <h3>Task Manager</h3>
        <div class="tabs">
          <button class="tab active" onclick="showTab('processes')">Processes</button>
          <button class="tab" onclick="showTab('system')">System</button>
        </div>
        <div id="tab-processes" class="tab-content active">
          <div class="process-list">
            <div class="process-item header"><span>PID</span><span>Name</span><span>CPU%</span><span>Memory</span><span>Action</span></div>
            <div id="processList">Loading...</div>
          </div>
        </div>
        <div id="tab-system" class="tab-content">
          <div class="info-row"><span class="info-label">Platform</span><span class="info-value" id="sysPlatform">-</span></div>
          <div class="info-row"><span class="info-label">Node Version</span><span class="info-value" id="sysNode">-</span></div>
          <div class="info-row"><span class="info-label">CPUs</span><span class="info-value" id="sysCpus">-</span></div>
          <div class="info-row"><span class="info-label">Total Memory</span><span class="info-value" id="sysMemTotal">-</span></div>
          <div class="info-row"><span class="info-label">Free Memory</span><span class="info-value" id="sysMemFree">-</span></div>
          <div class="info-row"><span class="info-label">Hostname</span><span class="info-value" id="sysHostname">-</span></div>
          <div class="info-row"><span class="info-label">Uptime</span><span class="info-value" id="sysUptime">-</span></div>
          <div class="info-row"><span class="info-label">Load Avg</span><span class="info-value" id="sysLoad">-</span></div>
        </div>
      </div>
    </aside>
  </div>
  <script>
    const ws = new WebSocket(`ws://${location.host}`);
    const consoleEl = document.getElementById('console');
    let autoScroll = true;
    let currentConfig = {};

    ws.onopen = () => {
      document.getElementById('wsStatus').classList.add('connected');
      document.getElementById('wsText').textContent = 'Connected';
    };
    ws.onclose = () => {
      document.getElementById('wsStatus').classList.remove('connected');
      document.getElementById('wsText').textContent = 'Disconnected';
      setTimeout(() => location.reload(), 3000);
    };
    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'init') {
        msg.data.logs.forEach(addLog);
        updateStatus(msg.data.running);
        if (msg.data.config) {
          currentConfig = msg.data.config;
          fillConfigForm(msg.data.config);
          updateBotInfo(msg.data.config);
        }
      } else if (msg.type === 'log') {
        addLog(msg.data);
      } else if (msg.type === 'status') {
        updateStatus(msg.data.running);
      } else if (msg.type === 'config') {
        currentConfig = msg.data;
        fillConfigForm(msg.data);
        updateBotInfo(msg.data);
      }
    };

    function addLog(entry) {
      const div = document.createElement('div');
      div.className = `log-entry log-type-${entry.type}`;
      div.innerHTML = `<span class="log-time">[${new Date(entry.time).toLocaleTimeString()}]</span>${escapeHtml(entry.message)}`;
      consoleEl.appendChild(div);
      if (autoScroll) consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateStatus(running) {
      const badge = document.getElementById('botStatus');
      badge.textContent = running ? 'Running' : 'Stopped';
      badge.className = `status-badge ${running ? 'running' : 'stopped'}`;
      document.getElementById('btnStart').disabled = running;
      document.getElementById('btnStop').disabled = !running;
      document.getElementById('btnRestart').disabled = !running;
      document.getElementById('btnReconnect').disabled = running;
    }

    function updateBotInfo(cfg) {
      document.getElementById('botUsername').textContent = cfg.username || '-';
      document.getElementById('botServer').textContent = `${cfg.host}:${cfg.port}`;
      document.getElementById('botVersion').textContent = cfg.version || '-';
    }

    function fillConfigForm(cfg) {
      document.getElementById('cfgHost').value = cfg.host || '';
      document.getElementById('cfgPort').value = cfg.port || '';
      document.getElementById('cfgVersion').value = cfg.version || '';
      document.getElementById('cfgUsername').value = cfg.username || '';
      document.getElementById('cfgPassword').value = '';
      document.getElementById('cfgAuth').value = cfg.auth || 'offline';
      document.getElementById('cfgAutoReconnect').checked = cfg.autoReconnect !== false;
      document.getElementById('cfgAntiAfk').checked = cfg.antiAfk !== false;
    }

    function sendCmd(action) {
      fetch(`/api/${action}`, { method: 'POST' })
        .then(r => r.json())
        .then(d => { if (!d.success) addLog({ type: 'error', message: d.msg, time: new Date().toISOString() }); });
    }

    function sendCommand() {
      const input = document.getElementById('cmdInput');
      const cmd = input.value.trim();
      if (!cmd) return;
      fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: cmd }) })
        .then(r => r.json())
        .then(d => { if (d.success) input.value = ''; });
    }

    function clearConsole() { consoleEl.innerHTML = ''; }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.onclick.toString().includes(`'${tab}'`)));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${tab}`));
      if (tab === 'processes') loadProcesses();
      if (tab === 'system') loadSystem();
    }

    async function loadProcesses() {
      try {
        const res = await fetch('/api/processes');
        const processes = await res.json();
        const container = document.getElementById('processList');
        container.innerHTML = processes.map(p => `
          <div class="process-item">
            <span class="process-pid">${p.pid}</span>
            <span class="process-name" title="${escapeHtml(p.cmd || p.name)}">${escapeHtml(p.name || p.cmd || 'unknown')}</span>
            <span class="process-cpu">${p.cpu || 0}%</span>
            <span class="process-mem">${formatBytes(p.mem)}</span>
            <div class="process-actions">
              <button class="btn btn-danger btn-sm" onclick="killProcess(${p.pid})">Kill</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('processList').innerHTML = '<div class="process-item"><span>Error loading</span></div>';
      }
    }

    async function killProcess(pid) {
      if (!confirm(`Kill process ${pid}?`)) return;
      const res = await fetch('/api/kill', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid }) });
      const data = await res.json();
      if (data.success) loadProcesses();
      else alert('Failed: ' + data.msg);
    }

    async function loadSystem() {
      try {
        const res = await fetch('/api/system');
        const data = await res.json();
        document.getElementById('sysPlatform').textContent = data.platform;
        document.getElementById('sysNode').textContent = data.node;
        document.getElementById('sysCpus').textContent = data.cpus;
        document.getElementById('sysMemTotal').textContent = formatBytes(data.memTotal);
        document.getElementById('sysMemFree').textContent = formatBytes(data.memFree);
        document.getElementById('sysHostname').textContent = data.hostname;
        document.getElementById('sysUptime').textContent = formatUptime(data.uptime);
        document.getElementById('sysLoad').textContent = data.load.join(', ');
      } catch (e) {}
    }

    async function saveConfig(e) {
      e.preventDefault();
      const config = {
        host: document.getElementById('cfgHost').value,
        port: parseInt(document.getElementById('cfgPort').value),
        version: document.getElementById('cfgVersion').value,
        username: document.getElementById('cfgUsername').value,
        auth: document.getElementById('cfgAuth').value,
        autoReconnect: document.getElementById('cfgAutoReconnect').checked,
        antiAfk: document.getElementById('cfgAntiAfk').checked
      };
      const pwd = document.getElementById('cfgPassword').value;
      if (pwd) config.password = pwd;
      const res = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
      const data = await res.json();
      if (data.success) {
        addLog({ type: 'system', message: 'Config saved', time: new Date().toISOString() });
        document.getElementById('cfgPassword').value = '';
      }
    }

    function formatBytes(bytes) { if (!bytes) return '-'; const units = ['B','KB','MB','GB']; let i = 0; while (bytes >= 1024 && i < 3) { bytes /= 1024; i++; } return bytes.toFixed(1) + ' ' + units[i]; }
    function formatUptime(sec) { if (!sec) return '-'; const h = Math.floor(sec/3600); const m = Math.floor((sec%3600)/60); const s = Math.floor(sec%60); return `${h}h ${m}m ${s}s`; }

    consoleEl.addEventListener('scroll', () => { autoScroll = consoleEl.scrollTop + consoleEl.clientHeight >= consoleEl.scrollHeight - 50; });

    setInterval(() => {
      fetch('/api/status').then(r => r.json()).then(d => {
        if (d.running) document.getElementById('botPid').textContent = d.pid || '-';
      });
      loadSystem();
    }, 5000);

    loadSystem();
  </script>
</body>
</html>
